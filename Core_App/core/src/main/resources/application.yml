server:
  port: 8082
  servlet:
    context-path: /api/core

spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/core_db
    username: core_user
    password: core_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

sso:
  service:
    url: http://localhost:8081/api/sso

jwt:
  secret: 25a8222ebdd4324f0229edebd6ad1308eca46d71844973a18749d14d3b8230c7

logging:
  level:
    com.healthcare.core: DEBUG
    org.springframework.security: DEBUG
