server:
  port: 8082
  servlet:
    context-path: /api/core

spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://postgres-core:5432/core_db
    username: core_user
    password: core_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

sso:
  service:
    url: http://sso:8081/api/sso

jwt:
  secret: ${JWT_SECRET:healthcare-super-secret-key-change-in-production-min-256-bits}

logging:
  level:
    com.healthcare.core: DEBUG
    org.springframework.security: DEBUG
